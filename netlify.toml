# One Netlify site serves both the React app and the Express API (as a Function).
[build]
  command = "npm install --prefix server && npm install --prefix client && npm run build --prefix client"
  publish = "client/dist"
  functions = "server/netlify/functions"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["express", "mongoose"]

[build.environment]
  NODE_VERSION = "22"

# /api/* → Express app running inside the "api" function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/api/:splat"
  status = 200

# SPA fallback for client-side routes (/search, /welcome)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
